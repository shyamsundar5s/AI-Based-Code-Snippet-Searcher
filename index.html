<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Snippet Searcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        .results {
            margin-top: 20px;
        }
        .result-item {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Code Snippet Searcher</h1>
        <form id="upload-form">
            <label>Upload Codebase:</label>
            <input type="file" id="file-upload" multiple>
            <button type="button" onclick="uploadFiles()">Upload</button>
        </form>
        
        <form id="search-form" style="margin-top: 20px;">
            <label>Search Query:</label>
            <input type="text" id="search-query" placeholder="Enter your question...">
            <button type="button" onclick="searchCode()">Search</button>
        </form>
        
        <div class="results" id="results"></div>
    </div>

    <script>
        async function uploadFiles() {
            const files = document.getElementById("file-upload").files;
            const formData = new FormData();
            for (let i = 0; i < files.length; i++) {
                formData.append("files", files[i]);
            }
            
            const response = await fetch("/upload/", {
                method: "POST",
                body: formData
            });
            const result = await response.json();
            alert(result.message);
        }

        async function searchCode() {
            const query = document.getElementById("search-query").value;
            const response = await fetch(`/search/?query=${encodeURIComponent(query)}`);
            const result = await response.json();
            
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";

            result.results.forEach(item => {
                const div = document.createElement("div");
                div.className = "result-item";
                div.innerHTML = `
                    <strong>File:</strong> ${item.file}<br>
                    <strong>Line Number:</strong> ${item.line_number}<br>
                    <strong>Snippet:</strong> <pre>${item.chunk}</pre>
                    <strong>Distance:</strong> ${item.distance.toFixed(2)}
                `;
                resultsDiv.appendChild(div);
            });
        }
    </script>
</body>
</html>
